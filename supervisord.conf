; ============================================================
; supervisord 配置 —— 管理单容器内的三个进程
;
;   mihomo    内核      :9090(API) :7890(代理)
;   panel     面板      :8080
;   refresh   刷新服务  :8765
;
; 刷新流程：refresh 服务跑完脚本后，通过 supervisorctl 重启 mihomo
;          （容器内直接操作进程，无需 docker socket）
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------- 1. mihomo 内核 ----------
[program:mihomo]
command=/usr/local/bin/mihomo -d /data -f /data/config.yaml
directory=/data
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/data"

; ---------- 2. 面板（Nuxt SSR）----------
[program:panel]
command=/usr/local/bin/node --enable-source-maps /app/panel/server/index.mjs
directory=/app/panel
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_CONTROL_PORT)s",NITRO_PORT="%(ENV_CONTROL_PORT)s",NITRO_HOST="0.0.0.0",HOST="0.0.0.0"

; ---------- 3. 刷新服务 ----------
[program:refresh]
command=/usr/bin/python3 /app/scripts/refresh-server.py
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WORKDIR="/app",PORT="%(ENV_REFRESH_PORT)s",MIHOMO_SECRET="%(ENV_MIHOMO_SECRET)s"
