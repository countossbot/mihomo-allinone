name: build

# 双架构分别用【原生 runner】构建，避免 QEMU 模拟（QEMU 下 apk 安装和
# 二进制校验会慢 10 倍以上），最后合并成一个多架构 manifest。
#
#   1) amd64  → ubuntu-24.04
#   2) arm64  → ubuntu-24.04-arm
#      两者并行，各自 buildx 按 digest 推送（不打 tag）
#   3) merge  → 收集 digest，用 imagetools 合成 manifest list 并打 tag
#
# 触发：push main / 打 tag(v*) / 手动

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'config.js'
      - 'scripts/**'
      - 'supervisord.conf'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- 1) 各架构并行构建（原生 runner，无模拟）----
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备构建元数据
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 单架构构建：--platform 只写一个，push by digest，供后续合并
      - name: 构建并推送 ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false          # 关掉 attestation，减小 manifest 体积
          sbom: false
          labels: |
            org.opencontainers.image.title=mihomo-allinone
            org.opencontainers.image.description=mihomo 内核 + metacubexd 面板 + 订阅管理/刷新服务（单容器）
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 关键：构建期不继承任何代理环境变量，
          # 否则 apk/pip 会尝试连 127.0.0.1:7890 而失败
          build-args: |
            HTTP_PROXY=
            HTTPS_PROXY=
            http_proxy=
            https_proxy=
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 记录 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=$digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---- 2) 把两个单架构镜像合并成一个多架构 manifest ----
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 tag 列表
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF#refs/tags/}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF#refs/tags/v}"
          fi
          echo "list=$TAGS" >> $GITHUB_OUTPUT
          echo "tags: $TAGS"

      - name: 列出收集到的 digest
        run: |
          ls -la /tmp/digests
          echo "digest 数量: $(ls /tmp/digests | wc -l)"

      - name: 合并为多架构 manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(echo "${{ steps.tags.outputs.list }}" | sed 's/,/ --tag /g' | sed 's/^/--tag /') \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: 校验合并结果
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
