# ============================================================
# mihomo-allinone —— 单容器部署
#
#   docker compose up -d
#
# 三个服务全在一个容器里（supervisord 管理）：
#   :8080  面板（metacubexd）
#   :7890  混合代理口
#   :8765  刷新按钮页
# ============================================================
services:
  mihomo:
    # GitHub Actions 构建的多架构镜像
    image: ghcr.io/countossbot/mihomo-allinone:latest
    container_name: mihomo-aio
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONTROL_PORT: "8080"
      REFRESH_PORT: "8765"

      # ---- 凭证：从 .env 读取（.env 已在 .gitignore 中，不会进版本库）----
      # 必填：内核控制密钥。[必填] 用 openssl rand -hex 16 生成
      MIHOMO_SECRET: ${MIHOMO_SECRET:?请在 .env 里设置 MIHOMO_SECRET}

      # ---- 订阅地址（可选）----
      # 逗号分隔多个订阅。留空则先启动，之后在管理页 http://<host>:18091 里添加。
      SUB_URLS: ${SUB_URLS:-}

      # ---- 节点筛选（可选）----
      REGION_WHITELIST: ${REGION_WHITELIST:-DE NL GB US JP SG FI DK}
      MAX_DELAY: ${MAX_DELAY:-3000}
      TEST_TIMEOUT: ${TEST_TIMEOUT:-3000}

    volumes:
      # 持久化：配置、geoip 数据、订阅缓存
      - ./data:/data
      # 面板后端地址（按部署方式不同而不同）
      - ./config.js:/app/panel/public/config.js:ro

    ports:
      - "127.0.0.1:18090:8080"   # 面板
      - "127.0.0.1:19090:9090"   # 内核 API（面板后端填这个）
      - "127.0.0.1:17893:7890"   # 代理口
      - "127.0.0.1:18091:8765"   # 订阅管理页
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun:/dev/net/tun
    # network_mode: host          # 注意：与 ports 映射互斥

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
