# ============================================================
# mihomo-allinone —— 官方 metacubexd-server 一体化部署
#
# 单容器内含：mihomo 内核 + metacubexd 面板（带配置管理页）
#
#   docker compose up -d
#
# 容器内固定端口：
#   8080  面板 + 配置管理（浏览器访问）
#   9090  内核控制 API（面板内部使用）
#   7890  混合代理口（HTTP + SOCKS5）
#
# 宿主机端口可在 .env 里覆盖（默认已避开常见的 8080/7890 占用）：
#   PANEL_PORT=18080   API_PORT=19090   PROXY_PORT=17890
# ============================================================
services:
  mihomo:
    # 官方一体化镜像：内核与面板同容器
    image: ghcr.io/metacubex/metacubexd-server:latest
    container_name: mihomo-aio
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ---- 面板控制令牌（必填）----
      # 登录面板用。生成：openssl rand -hex 16
      CONTROL_TOKEN: ${CONTROL_TOKEN:?请在 .env 里设置 CONTROL_TOKEN}

      # ---- 内核 API 密钥（必填，须与 CONTROL_TOKEN 不同）----
      CLASH_SECRET: ${CLASH_SECRET:?请在 .env 里设置 CLASH_SECRET}

      # 面板打开时预填的后端地址（容器内地址，一般不用改）
      DEFAULT_BACKEND_URL: ${DEFAULT_BACKEND_URL:-http://127.0.0.1:9090}

      # 容器内端口（固定，勿改）
      CONTROL_PORT: "8080"
      CLASH_API_PORT: "9090"
      MIXED_PORT: "7890"

    ports:
      # 面板：默认只绑本机，公网请在外面加反向代理
      - "127.0.0.1:${PANEL_PORT:-18080}:8080"
      # 内核控制 API：只绑本机
      - "127.0.0.1:${API_PORT:-19090}:9090"
      # 代理口：默认【不映射】，避免与本机已有的代理（如 ClashX 占用 7890）冲突。
      # 需要从宿主机连代理时取消注释；若要对外提供代理，改 0.0.0.0 并配防火墙。
      # - "127.0.0.1:${PROXY_PORT:-17890}:7890"

    volumes:
      # 持久化：配置、订阅、geoip 数据、缓存
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/control/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
